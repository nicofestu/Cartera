<!DOCTYPE html>

<style>

<body>
<div id="boot"><div class="card"><div class="title">Cargando Portfolio Intelligence…</div><div class="muted">Preparando la versión con comisiones de compra y venta.</div><div id="error"></div></div></div>
<script>
(async()=>{
  const SOURCES=["https://raw.githubusercontent.com/nicofestu/Cartera/70bee90a0029fee47f6d8978981bd7c342033ddc/index.html",'https://cdn.jsdelivr.net/gh/nicofestu/Cartera@70bee90a0029fee47f6d8978981bd7c342033ddc/index.html'];
  const CACHE_KEY='cartera_index_comisiones_70bee90a_v1';
  const OPS=[{"old":"      <div id=\"f-total\"><label>Total operación<\/label><input id=\"m-total\" disabled><\/div>","new":"      <div class=\"full\" id=\"f-comision\">\n        <label>Comisión (%)<\/label>\n        <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n          <input type=\"number\" id=\"m-comision\" min=\"0\" max=\"100\" step=\"0.001\" value=\"0.5\" style=\"max-width:150px\">\n          <button type=\"button\" class=\"btn mini\" onclick=\"setComision(1)\">1%<\/button>\n          <button type=\"button\" class=\"btn mini\" onclick=\"setComision(0.75)\">0,75%<\/button>\n          <button type=\"button\" class=\"btn mini\" onclick=\"setComision(0.5)\">0,5%<\/button>\n          <button type=\"button\" class=\"btn mini\" onclick=\"setComision(0.25)\">0,25%<\/button>\n          <button type=\"button\" class=\"btn mini\" onclick=\"setComision(0.125)\">0,125%<\/button>\n          <button type=\"button\" class=\"btn mini\" onclick=\"setComision(0)\">0%<\/button>\n        <\/div>\n        <div class=\"hint\">Se calcula sobre el importe bruto. En una compra se suma al total pagado; en una venta se descuenta del total cobrado.<\/div>\n      <\/div>\n      <div id=\"f-total\"><label id=\"lbl-total\">Total operación<\/label><input id=\"m-total\" disabled>\n        <div class=\"hint\" id=\"h-total\"><\/div><\/div>","expected":1,"label":"commission field"},{"old":"const sgn=n=> (n>0?\"+\":\"\")+fmt(n,2)+\"%\";\nconst hoy=()=> new Date().toLocaleDateString(\"sv-SE\"); // YYYY-MM-DD local","new":"const sgn=n=> (n>0?\"+\":\"\")+fmt(n,2)+\"%\";\nconst COMISION_PREDETERMINADA=0.5;\nconst fmtComision=n=>Number(n||0).toLocaleString(\"es-AR\",{maximumFractionDigits:3});\nfunction tasaComisionMov(m){\n  if(!m||(m.op!==\"compra\"&&m.op!==\"venta\")) return 0;\n  const n=Number(m.comisionPct);\n  return isFinite(n)&&n>=0?n:0; // movimientos históricos sin el campo conservan 0%\n}\nfunction montoBrutoMov(m){\n  return (Number(m?.precio)||0)/divisorDe(m?.tipo)*(Number(m?.cantidad)||0);\n}\nfunction comisionMov(m){ return montoBrutoMov(m)*tasaComisionMov(m)/100; }\nfunction montoNetoMov(m){\n  const bruto=montoBrutoMov(m), comision=comisionMov(m);\n  if(m?.op===\"compra\") return bruto+comision;\n  if(m?.op===\"venta\") return Math.max(0,bruto-comision);\n  return bruto;\n}\nconst hoy=()=> new Date().toLocaleDateString(\"sv-SE\"); // YYYY-MM-DD local","expected":1,"label":"commission helpers"},{"old":"    const bruto=m.precio/divisorDe(m.tipo)*m.cantidad;\n    const a=esUSD?bruto*m.mep:bruto;\n    const u=esUSD?bruto:bruto/m.mep;","new":"    const bruto=montoBrutoMov(m);\n    const importe=montoNetoMov(m);\n    const a=esUSD?importe*m.mep:importe;\n    const u=esUSD?importe:importe/m.mep;","expected":1,"label":"cash engine amount"},{"old":"      if(libre){ dA=-a; dU=-u; dN=-bruto; }","new":"      if(libre){ dA=-a; dU=-u; dN=-importe; }","expected":1,"label":"imported account buy cash"},{"old":"        dN=-Math.max(0,Math.min(nP[k],bruto));","new":"        dN=-Math.max(0,Math.min(nP[k],importe));","expected":1,"label":"manual account buy cash"},{"old":"    else { dA=a; dU=u; dN=bruto; } // venta y dividendo acreditan caja y no son aporte externo","new":"    else { dA=a; dU=u; dN=importe; } // venta neta de comisión y dividendo acreditan caja; no son aporte externo","expected":1,"label":"sale cash"},{"old":"    const div=divisorDe(m.tipo);\n    const bruto=m.precio/div*m.cantidad;\n    const cARS=m.moneda===\"USD\"?bruto*m.mep:bruto;\n    const cUSD=m.moneda===\"USD\"?bruto:bruto/m.mep;","new":"    const importe=montoNetoMov(m);\n    const cARS=m.moneda===\"USD\"?importe*m.mep:importe;\n    const cUSD=m.moneda===\"USD\"?importe:importe/m.mep;","expected":3,"label":"position cost and realized P&L"},{"old":"  document.getElementById(\"m-err\").style.display=\"none\";\n  document.getElementById(\"m-total\").value=\"\";\n  document.getElementById(\"m-liq\").value=(ed&&typeof ed.liq===\"number\")?String(ed.liq):\"\";","new":"  document.getElementById(\"m-err\").style.display=\"none\";\n  document.getElementById(\"m-total\").value=\"\";\n  document.getElementById(\"m-comision\").value=ed?tasaComisionMov(ed):COMISION_PREDETERMINADA;\n  document.getElementById(\"m-liq\").value=(ed&&typeof ed.liq===\"number\")?String(ed.liq):\"\";","expected":1,"label":"load commission in modal"},{"old":"  document.getElementById(\"f-caucion\").style.display=caucion?\"block\":\"none\";\n  document.getElementById(\"lbl-precio\").textContent=cash?\"Monto\":\"Precio unitario\";","new":"  document.getElementById(\"f-caucion\").style.display=caucion?\"block\":\"none\";\n  document.getElementById(\"f-comision\").style.display=(!cash&&!caucion)?\"block\":\"none\";\n  document.getElementById(\"lbl-precio\").textContent=cash?\"Monto\":\"Precio unitario\";","expected":1,"label":"toggle commission field"},{"old":"  if(caucion) calcCaucion(); else monedaChanged();\n  refrescarMaxRetiro();","new":"  if(caucion) calcCaucion(); else monedaChanged();\n  calcTotal();\n  refrescarMaxRetiro();","expected":1,"label":"refresh total on operation change"},{"old":"    document.getElementById(\"m-poolusd\").value=\"MEP\";\n  }\n  monedaChanged();","new":"    document.getElementById(\"m-poolusd\").value=\"MEP\";\n    calcTotal();\n  }\n  monedaChanged();","expected":1,"label":"clear stale total for new movement"},{"old":"[\"m-cant\",\"m-precio\",\"m-tipo\"].forEach(id=>document.getElementById(id).addEventListener(\"input\",calcTotal));","new":"[\"m-cant\",\"m-precio\",\"m-tipo\",\"m-comision\"].forEach(id=>document.getElementById(id).addEventListener(\"input\",calcTotal));","expected":1,"label":"total listeners"},{"old":"function calcTotal(){\n  const t=document.getElementById(\"m-tipo\").value;\n  const c=parseFloat(document.getElementById(\"m-cant\").value), p=parseFloat(document.getElementById(\"m-precio\").value);\n  document.getElementById(\"m-total\").value=(c>0&&p>0)?fmt(p/divisorDe(t)*c,2):\"\";\n}","new":"function setComision(v){\n  document.getElementById(\"m-comision\").value=v;\n  calcTotal();\n}\nfunction calcTotal(){\n  const t=document.getElementById(\"m-tipo\").value;\n  const op=document.getElementById(\"m-op\").value;\n  const c=parseFloat(document.getElementById(\"m-cant\").value), p=parseFloat(document.getElementById(\"m-precio\").value);\n  const tasa=Number(String(document.getElementById(\"m-comision\").value||0).replace(\",\",\".\"))||0;\n  const bruto=(c>0&&p>0)?p/divisorDe(t)*c:0;\n  const aplica=op===\"compra\"||op===\"venta\";\n  const comision=aplica?bruto*tasa/100:0;\n  const neto=op===\"compra\"?bruto+comision:op===\"venta\"?Math.max(0,bruto-comision):bruto;\n  document.getElementById(\"lbl-total\").textContent=op===\"compra\"?\"Total a pagar\":op===\"venta\"?\"Total a cobrar\":\"Total operación\";\n  document.getElementById(\"m-total\").value=bruto>0?fmt(neto,2):\"\";\n  document.getElementById(\"h-total\").textContent=bruto>0&&aplica\n    ?`Bruto ${fmt(bruto,2)} · comisión ${fmt(comision,2)} (${fmtComision(tasa)}%)`\n    :\"\";\n}","expected":1,"label":"commission preview"},{"old":"async function guardarMov(){\n  const err=document.getElementById(\"m-err\");\n  const tipo=document.getElementById(\"m-tipo\").value;\n  if(esCash()){ return guardarCash(); }\n  if(esCaucion()){ return guardarCaucion(); }\n  const selCta=document.getElementById(\"m-cuenta-sel\").value;\n  const cuenta=canonizarCta(selCta===\"__nueva__\"?document.getElementById(\"m-cuenta-nueva\").value:selCta);\n  const m={","new":"async function guardarMov(){\n  const err=document.getElementById(\"m-err\");\n  const tipo=document.getElementById(\"m-tipo\").value;\n  if(esCash()){ return guardarCash(); }\n  if(esCaucion()){ return guardarCaucion(); }\n  const selCta=document.getElementById(\"m-cuenta-sel\").value;\n  const cuenta=canonizarCta(selCta===\"__nueva__\"?document.getElementById(\"m-cuenta-nueva\").value:selCta);\n  const comisionPct=Number(String(document.getElementById(\"m-comision\").value||0).replace(\",\",\".\"));\n  const m={","expected":1,"label":"read commission"},{"old":"    cantidad:parseFloat(document.getElementById(\"m-cant\").value),\n    precio:parseFloat(document.getElementById(\"m-precio\").value),\n    moneda:document.getElementById(\"m-moneda\").value,\n    poolUSD:document.getElementById(\"m-poolusd\").value,\n  };","new":"    cantidad:parseFloat(document.getElementById(\"m-cant\").value),\n    precio:parseFloat(document.getElementById(\"m-precio\").value),\n    moneda:document.getElementById(\"m-moneda\").value,\n    poolUSD:document.getElementById(\"m-poolusd\").value,\n    comisionPct,\n  };","expected":1,"label":"store commission"},{"old":"  // Validaciones\n  const falta=!m.fecha||!m.cuenta||!(m.cantidad>0)||!(m.precio>0)||(tipo===\"fci\"?!m.fondo:!m.ticker);","new":"  // Validaciones\n  if(!isFinite(m.comisionPct)||m.comisionPct<0||m.comisionPct>100){\n    err.textContent=\"La comisión debe ser un porcentaje entre 0% y 100%.\"; err.style.display=\"block\"; return;\n  }\n  const falta=!m.fecha||!m.cuenta||!(m.cantidad>0)||!(m.precio>0)||(tipo===\"fci\"?!m.fondo:!m.ticker);","expected":1,"label":"validate commission"},{"old":"<th>Precio<\/th><th>Total<\/th><th>MEP del día<\/th>","new":"<th>Precio<\/th><th>Total neto<\/th><th>MEP del día<\/th>","expected":1,"label":"operations table header"},{"old":"      const tot=m.precio/divisorDe(m.tipo)*m.cantidad;\n      const opCls=(m.op===\"compra\"||m.op===\"deposito\"||m.op===\"dividendo\")?\"op-c\":\"op-v\";","new":"      const bruto=montoBrutoMov(m), comision=comisionMov(m), tot=montoNetoMov(m), tasa=tasaComisionMov(m);\n      const opCls=(m.op===\"compra\"||m.op===\"deposito\"||m.op===\"dividendo\")?\"op-c\":\"op-v\";","expected":1,"label":"operations table amounts"},{"old":"      <td>${m.moneda===\"USD\"?\"US$ \":\"$ \"}${fmt(tot,m.moneda===\"USD\"?2:0)}<\/td>","new":"      <td>${m.moneda===\"USD\"?\"US$ \":\"$ \"}${fmt(tot,m.moneda===\"USD\"?2:0)}${comision>0?`<div style=\"margin-top:4px;color:var(--grey);font-size:10px;white-space:nowrap\">Bruto ${m.moneda===\"USD\"?\"US$ \":\"$ \"}${fmt(bruto,m.moneda===\"USD\"?2:0)} · comisión ${m.moneda===\"USD\"?\"US$ \":\"$ \"}${fmt(comision,m.moneda===\"USD\"?2:0)} (${fmtComision(tasa)}%)<\/div>`:\"\"}<\/td>","expected":1,"label":"operations table net amount"}];
  const count=(text,needle)=>needle===''?0:text.split(needle).length-1;
  try{
    let html=null, ultimoError=null;
    for(const source of SOURCES){
      try{
        const response=await fetch(source,{cache:'no-store'});
        if(!response.ok) throw new Error('HTTP '+response.status);
        html=await response.text();
        if(html.includes('<!DOCTYPE html>')) break;
        html=null;
      }catch(e){ ultimoError=e; }
    }
    if(!html) html=localStorage.getItem(CACHE_KEY);
    if(!html) throw new Error('No se pudo cargar la base de la app'+(ultimoError?' ('+ultimoError.message+')':'')+'.');
    for(const op of OPS){
      const found=count(html,op.old);
      if(found!==op.expected) throw new Error(op.label+': se esperaban '+op.expected+' coincidencias y se encontraron '+found+'.');
      if(op.expected===1) html=html.replace(op.old,op.new);
      else html=html.split(op.old).join(op.new);
    }
    const required=['id="m-comision"','comisionPct,','function montoNetoMov(m)','Total neto','Total a pagar','Total a cobrar'];
    for(const token of required) if(!html.includes(token)) throw new Error('Falta una parte del cambio: '+token);
    try{ localStorage.setItem(CACHE_KEY,html); }catch(e){}
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    const e=document.getElementById('error');
    e.style.display='block';
    e.textContent='No se pudo iniciar la app.\n\n'+(err&&err.message?err.message:String(err));
    console.error(err);
  }
})();
</script>
</body>
</html>
