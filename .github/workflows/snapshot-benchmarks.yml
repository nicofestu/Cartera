name: Snapshot historial de mercado

on:
  schedule:
    # 21:30 UTC = 18:30 en Argentina (BYMA cierra 17:00 ART; media hora de margen por delay) — lunes a viernes
    - cron: '30 21 * * 1-5'
  workflow_dispatch: {}   # permite disparar manualmente desde la pestana Actions, para probar

permissions:
  contents: write   # necesario para que el job pueda comitear el archivo actualizado

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tomar snapshot de precios (bonos, letras, acciones, cedears)
        run: python scripts/snapshot_historial.py

      # Tasas libres de riesgo para Sharpe y Sortino: RIX del BCRA + caucion de
      # BYMA para los dias que el BCRA todavia no publico, y Fed Funds de FRED.
      # continue-on-error a proposito: si una fuente de tasas se cae, no tiene
      # que impedir que se comitee el snapshot de precios del dia.
      - name: Actualizar tasas libres de riesgo
        continue-on-error: true
        run: python scripts/snapshot_tasas.py

      - name: Comitear si hubo cambios
        run: |
          git config user.name "snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add historial/
          git diff --staged --quiet || git commit -m "Snapshot de mercado $(date -u +%Y-%m-%d)"
          git push
